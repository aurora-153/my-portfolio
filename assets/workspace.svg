<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E2DA"/>
      <stop offset="100%" stop-color="#DAD6CC"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C20"/>
      <stop offset="100%" stop-color="#0E1012"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3836"/>
      <stop offset="100%" stop-color="#242220"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="450" cy="180" r="400">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="900" height="650" fill="url(#wallGradient)"/>
  <rect width="900" height="400" fill="url(#lampGlow)"/>

  <!-- Minimal Architectural Grid Lines & Markings -->
  <line x1="50" y1="50" x2="850" y2="50" stroke="#161616" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="50" y1="600" x2="850" y2="600" stroke="#161616" stroke-width="1" stroke-opacity="0.12"/>
  <text x="60" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#161616" letter-spacing="2" opacity="0.4">WORKSPACE ARCHIVE // LAB_01</text>
  <text x="710" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#161616" letter-spacing="2" opacity="0.4">SETUP: RIG + SKETCH</text>

  <!-- Desk Surface & Legs -->
  <path d="M 60 410 L 840 410 L 880 470 L 20 470 Z" fill="url(#deskTop)"/>
  <rect x="20" y="470" width="860" height="18" fill="#181716"/>
  <!-- Desk Legs -->
  <rect x="70" y="488" width="18" height="150" fill="#201E1C"/>
  <rect x="812" y="488" width="18" height="150" fill="#201E1C"/>

  <!-- Large Ultrawide Curved Display -->
  <g id="monitor" transform="translate(170, 90)">
    <!-- Monitor Stand -->
    <path d="M 260 270 L 280 180 L 300 270 Z" fill="#2C2C2C"/>
    <ellipse cx="280" cy="275" rx="70" ry="14" fill="#202020"/>
    <!-- Outer Bezel -->
    <rect x="0" y="0" width="560" height="220" rx="12" fill="#151515" stroke="#333333" stroke-width="2"/>
    <!-- Screen Surface -->
    <rect x="12" y="12" width="536" height="196" rx="6" fill="url(#screenGlow)"/>

    <!-- Terminal Code / C Architecture / Prompt Engineering Lines -->
    <g transform="translate(30, 32)">
      <!-- Mac/Window Dots -->
      <circle cx="8" cy="8" r="4" fill="#E6392E"/>
      <circle cx="22" cy="8" r="4" fill="#555555"/>
      <circle cx="36" cy="8" r="4" fill="#2E7D47"/>

      <text x="56" y="11" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888888">c-runtime-allocator.c — tmux</text>

      <text x="10" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E6392E">#include &lt;stdio.h&gt;</text>
      <text x="10" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E6392E">#include &lt;stdlib.h&gt;</text>
      <text x="10" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8899A6">// Year 1 Systems &amp; Memory Allocation</text>
      <text x="10" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF"><tspan fill="#38A169">void</tspan> *arena_alloc(Arena *a, <tspan fill="#38A169">size_t</tspan> size) {</text>
      <text x="26" y="116" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DDD">assert(a-&gt;offset + size &lt;= a-&gt;capacity);</text>
      <text x="26" y="134" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DDD"><tspan fill="#38A169">void</tspan> *ptr = &amp;a-&gt;buffer[a-&gt;offset];</text>
      <text x="26" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#DDD">a-&gt;offset += (size + 7) &amp; ~7; <tspan fill="#2E7D47">// 8-byte aligned</tspan></text>
      <text x="26" y="170" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF"><tspan fill="#E6392E">return</tspan> ptr; }</text>
    </g>

    <!-- Side Window: Neural AI Prompt Pipeline Inspector -->
    <g transform="translate(340, 32)">
      <rect x="0" y="0" width="190" height="160" rx="4" fill="#121517" stroke="#222" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2E7D47">PIPELINE: PROMPT_EVAL</text>
      <rect x="12" y="32" width="166" height="2" fill="#2A2A2A"/>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#999">SYSTEM: Autonomous Context</text>
      <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#999">TOKENS: 4,128 / LATENCY: 84ms</text>
      <rect x="12" y="80" width="120" height="6" rx="3" fill="#2E7D47"/>
      <rect x="136" y="80" width="42" height="6" rx="3" fill="#E6392E"/>
      <text x="12" y="106" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E6392E">&gt; TEST_SUITE PASSED</text>
      <circle cx="168" cy="140" r="10" fill="#1B221E"/>
      <circle cx="168" cy="140" r="4" fill="#2E7D47"/>
    </g>
  </g>

  <!-- Large Minimal Desk Pad -->
  <rect x="140" y="425" width="620" height="155" rx="10" fill="#191919" stroke="#2D2D2D" stroke-width="1.5"/>

  <!-- Mechanical Keyboard (Split Ortholinear / Compact 65%) -->
  <g id="keyboard" transform="translate(230, 440)">
    <rect x="0" y="0" width="260" height="85" rx="6" fill="#252525" stroke="#3A3A3A" stroke-width="1"/>
    <!-- Keys rows pattern -->
    <rect x="8" y="8" width="244" height="69" rx="4" fill="#1C1C1C"/>
    <!-- Keycap grid mock -->
    <path d="M 12 12 h 236 M 12 24 h 236 M 12 36 h 236 M 12 48 h 236 M 12 60 h 236" stroke="#2F2F2F" stroke-width="1.5"/>
    <path d="M 28 12 v 60 M 44 12 v 60 M 60 12 v 60 M 76 12 v 60 M 92 12 v 60 M 108 12 v 60 M 124 12 v 60 M 140 12 v 60 M 156 12 v 60 M 172 12 v 60 M 188 12 v 60 M 204 12 v 60 M 220 12 v 60" stroke="#2F2F2F" stroke-width="1.5"/>
    <!-- Red Accent Enter & Escape Keys -->
    <rect x="10" y="14" width="16" height="10" rx="2" fill="#E6392E"/>
    <rect x="220" y="38" width="28" height="10" rx="2" fill="#E6392E"/>
    <!-- Coiled Cable to Desk -->
    <path d="M 130 0 C 130 -15, 150 -15, 150 -25 C 150 -35, 170 -35, 170 -45" stroke="#4A4A4A" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Ergonomic Wireless Mouse -->
  <g id="mouse" transform="translate(530, 455)">
    <rect x="0" y="0" width="46" height="74" rx="20" fill="#262626" stroke="#383838" stroke-width="1"/>
    <line x1="23" y1="6" x2="23" y2="30" stroke="#161616" stroke-width="1.5"/>
    <rect x="20" y="16" width="6" height="12" rx="3" fill="#E6392E"/>
  </g>

  <!-- Digital Drawing Tablet & Stylus (Drawing Characters) -->
  <g id="drawing-tablet" transform="translate(610, 435)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="#1C1C1C" stroke="#333" stroke-width="1.5"/>
    <!-- Active screen showing anime/character pencil outline -->
    <rect x="10" y="10" width="110" height="76" rx="4" fill="#EAE7DE"/>
    <!-- Character line art sketch -->
    <path d="M 45 60 C 45 40, 55 25, 70 25 C 85 25, 95 40, 95 60" stroke="#222" stroke-width="1.5" fill="none"/>
    <path d="M 52 42 C 60 40, 68 45, 75 42" stroke="#222" stroke-width="1.5" fill="none"/>
    <path d="M 60 52 C 65 55, 75 55, 80 52" stroke="#222" stroke-width="1.2" fill="none"/>
    <path d="M 40 28 L 55 18 L 70 30 L 85 18 L 100 28" stroke="#333" stroke-width="1.8" fill="none"/>
    <!-- Stylus -->
    <line x1="120" y1="18" x2="90" y2="60" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="89" cy="61" r="2" fill="#E6392E"/>
  </g>

  <!-- Sketchbook on Desk with Pencil -->
  <g id="sketchbook" transform="translate(40, 430)">
    <rect x="0" y="0" width="90" height="120" rx="4" fill="#F4F1E8" stroke="#D1CDC2" stroke-width="1"/>
    <!-- Spiral Ring binding -->
    <line x1="8" y1="5" x2="8" y2="115" stroke="#777" stroke-width="2" stroke-dasharray="3,5"/>
    <text x="18" y="28" font-family="'Instrument Serif', serif" font-style="italic" font-size="11" fill="#444">sketches // '26</text>
    <!-- Character face quick gestures -->
    <circle cx="50" cy="65" r="20" stroke="#888" stroke-width="1" fill="none"/>
    <line x1="40" y1="65" x2="60" y2="65" stroke="#999" stroke-width="0.8"/>
    <line x1="50" y1="55" x2="50" y2="75" stroke="#999" stroke-width="0.8"/>
    <!-- Mechanical Drawing Pencil -->
    <rect x="75" y="10" width="5" height="95" rx="2" fill="#202020" transform="rotate(12, 75, 10)"/>
  </g>

  <!-- Studio Headphones Resting on Audio Interface -->
  <g id="audio-station" transform="translate(60, 290)">
    <rect x="0" y="45" width="80" height="35" rx="4" fill="#1F1F1F" stroke="#333" stroke-width="1"/>
    <!-- Knobs & Ambient LED -->
    <circle cx="20" cy="62" r="7" fill="#2C2C2C" stroke="#444" stroke-width="1"/>
    <circle cx="45" cy="62" r="7" fill="#2C2C2C" stroke="#444" stroke-width="1"/>
    <circle cx="68" cy="62" r="3" fill="#2E7D47"/>
    <!-- Studio Over-ear Headphones -->
    <path d="M 12 35 C 12 -5, 68 -5, 68 35" stroke="#252525" stroke-width="5" fill="none"/>
    <ellipse cx="12" cy="35" rx="8" ry="14" fill="#181818" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="68" cy="35" rx="8" ry="14" fill="#181818" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- Pro Badminton Racket & Feather Shuttlecock (Off-screen Reset) -->
  <g id="badminton-gear" transform="translate(770, 310)">
    <!-- Racket Head (Elliptical frame) leaning against desk -->
    <ellipse cx="40" cy="80" rx="36" ry="46" fill="none" stroke="#242424" stroke-width="4"/>
    <!-- Racket String Mesh Grid -->
    <g stroke="#888888" stroke-width="0.8" opacity="0.45">
      <line x1="16" y1="80" x2="64" y2="80"/>
      <line x1="18" y1="65" x2="62" y2="65"/>
      <line x1="18" y1="95" x2="62" y2="95"/>
      <line x1="24" y1="50" x2="56" y2="50"/>
      <line x1="24" y1="110" x2="56" y2="110"/>
      <line x1="40" y1="38" x2="40" y2="122"/>
      <line x1="30" y1="42" x2="30" y2="118"/>
      <line x1="50" y1="42" x2="50" y2="118"/>
    </g>
    <!-- Racket Throat & Shaft -->
    <path d="M 36 126 L 40 140 L 44 126" stroke="#242424" stroke-width="3" fill="none"/>
    <line x1="40" y1="140" x2="60" y2="290" stroke="#202020" stroke-width="4"/>
    <!-- Racket Handle with Red Grip Tape -->
    <line x1="56" y1="260" x2="63" y2="310" stroke="#E6392E" stroke-width="7" stroke-linecap="round"/>

    <!-- Goose Feather Shuttlecock -->
    <g transform="translate(10, 195) rotate(-25)">
      <!-- Cork base -->
      <path d="M 12 18 C 12 14, 20 14, 20 18 Z" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="1"/>
      <rect x="12" y="18" width="8" height="2" fill="#E6392E"/>
      <!-- Feathers cone -->
      <path d="M 12 20 L 4 36 L 28 36 L 20 20 Z" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="1"/>
      <line x1="4" y1="32" x2="28" y2="32" stroke="#2E7D47" stroke-width="1"/>
    </g>
  </g>

  <!-- Editorial Annotation Stamp -->
  <g transform="translate(730, 595)">
    <rect x="0" y="0" width="130" height="24" rx="3" fill="#161616"/>
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F7F5EF" letter-spacing="1.5">HABITAT // '26</text>
  </g>
</svg>
